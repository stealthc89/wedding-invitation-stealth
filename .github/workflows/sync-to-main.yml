name: Sync to Main Repo

on:
  push:
    branches:
      - '**'
  delete:
    branches:
      - '**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Add main remote
        run: |
          git remote add main https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/ddl-chris-mutono/wedding-invitation.git

      - name: Push to main repo
        run: |
          git push main --all --force
          git push main --tags --force
